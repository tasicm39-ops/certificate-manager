# Blueprint za Render: podesi env varijable (DATABASE_URL, itd.) u dashboardu.
# Za React Router: rewrite šalje sve rute na index.html (inače /upload i /list daju 404).
services:
  - type: web
    name: certificate-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health

  - type: web
    name: certificate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
